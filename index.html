<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="文献阅读笔记目录，收录课程论文的网页讲义、研究背景、理论模型和原文资料。" />
  <title>文献阅读</title>
  <style>
    :root {
      --page: #f7f9fc;
      --paper: #ffffff;
      --ink: #1f2937;
      --muted: #64748b;
      --line: #d8e0ea;
      --accent: #8b1e3f;
      --accent-dark: #64152d;
      --shadow: 0 14px 34px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.7;
    }

    header {
      background: #18202f;
      color: white;
      border-bottom: 5px solid var(--accent);
    }

    .inner {
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
    }

    .hero {
      padding: 2.6rem 0 2.8rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 720px;
      margin: 0.85rem 0 0;
      color: #dbeafe;
      font-size: 1rem;
    }

    main {
      padding: 1.4rem 0 3rem;
    }

    .literature-list {
      display: grid;
      gap: 1rem;
    }

    .item {
      padding: 1.15rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .item h2 {
      margin: 0;
      color: var(--accent-dark);
      font-size: 1.25rem;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .item p {
      margin: 0.55rem 0 0.9rem;
      color: var(--muted);
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 0.34rem 0.72rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--accent);
      background: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.92rem;
      line-height: 1.25;
    }

    .links a:hover {
      color: white;
      border-color: var(--accent);
      background: var(--accent);
    }

    @media (max-width: 560px) {
      .inner { width: min(100% - 1.4rem, 1120px); }
      .links a {
        flex: 1 1 132px;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="inner hero">
      <h1>文献阅读</h1>
      <p class="subtitle">课程论文阅读笔记、理论模型推导、研究背景和原文资料整理。</p>
    </div>
  </header>

  <main>
    <div class="inner literature-list">
      <article class="item">
        <h2>The Great Leap Forward: Anatomy of a Central Planning Disaster</h2>
        <p>Wei Li & Dennis Tao Yang (2005)，关于大跃进时期中央计划、资源转移、过度征购与粮食产量崩溃的文献阅读整理。</p>
        <div class="links">
          <a href="The-Great-Leap-Forward/">进入文献页</a>
          <a href="The-Great-Leap-Forward/研究背景.html">研究背景</a>
          <a href="The-Great-Leap-Forward/理论模型.html">理论模型</a>
          <a href="The-Great-Leap-Forward/The%20Great%20Leap%20Forward.pdf">原文 PDF</a>
        </div>
      </article>
    </div>
  </main>
</body>
</html>
